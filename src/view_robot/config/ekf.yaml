ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    sensor_timeout: 0.1

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /diff_cont/odom
    odom0_config: [false, false, false, # от колесной одометрии только vx и vyaw
                  false, false, false,
                  true,  false, false,
                  false, false, true,
                  false, false, false]

    imu0: /imu/data
    imu0_config: [false, false, false, # от imu только vyaw
              false, false, false,
              false, false, false,
              false, false, true,
              false, false, false]
    sensor_timeout: 0.1

    odom0_queue_size: 10
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    #odom1: /odom_rf2o
    #odom1_config: [false, false, false,
    #               false, false, false,
    #               true,  false, false,   # Vx
    #               false, false, true,   # Vyaw — опционально true
    #               false, false, false]
    #odom1_differential: false   # т.к. фьюзишь скорость, не позу
