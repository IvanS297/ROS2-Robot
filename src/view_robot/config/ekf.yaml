ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    sensor_timeout: 0.1

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                  false, false, false,
                  true,  false, false,
                  false, false, true,
                  false, false, false]

    imu0: /imu/data
    imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, true,
              false, false, false]
    sensor_timeout: 0.1
    imu0_remove_gravitational_acceleration: true